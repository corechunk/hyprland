bind = SUPER, R, exec, hyprctl reload

# Directory Variables
$hypr_DIR = $HOME/.config/hypr
$configs_DIR = $hypr_DIR/configs
$keybindings_DIR = $configs_DIR/keybindings
$scripts_DIR = $hypr_DIR/scripts
$QS_DIR = $HOME/.config/quickshell

# modular config files sourcing
source = $configs_DIR/variables.conf
source = $configs_DIR/colors/current_color.conf
source = $configs_DIR/startups.conf
source = $configs_DIR/monitors.conf
source = $configs_DIR/environment.conf
source = $configs_DIR/decorations.conf
source = $configs_DIR/animations/_curves.conf
source = $configs_DIR/animations/windows/current_windows.conf
source = $configs_DIR/animations/workspaces/current_workspaces.conf
source = $configs_DIR/animations/layers/current_layers.conf
source = $configs_DIR/animations/borders/current_borders.conf
source = $configs_DIR/layouts.conf

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}

# XWayland configuration
xwayland {
    force_zero_scaling = true
}

source = $configs_DIR/inputs.conf
source = $configs_DIR/gestures.conf
source = $configs_DIR/keybindings.conf
source = $configs_DIR/windowrules.conf


