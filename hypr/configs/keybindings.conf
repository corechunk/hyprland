####################
### KEYBINDINGSS ###
####################


# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier
# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more


# Basic Actions
    bind = $mainMod, H, exec, bash $scripts_DIR/utils/shortcuts.sh

	bind = $mainMod, Q, killactive,
    bind = $mainMod CTRL SHIFT ALT, BACKSPACE,exit,
	bind = $mainMod, Z, exec, bash $scripts_DIR/utils/dock.sh
    bind = $mainMod, D, exec, $menu
    bind = $mainMod ALT, D, exec, nwg-drawer
    bind = $mainMod SHIFT, B, exec, pkill -USR1 waybar # toggle waybar
    bind = $mainMod, N, exec, swaync-client -t

    bind = $mainMod, W, exec, bash $scripts_DIR/wallpaper/wallpaper-select-patch.sh
    bind = $mainMod ALT, V, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy
    bind = $mainMod, L, exec, $QS_DIR/modules/SessionLock/lock.sh
	bind = $mainMod ALT, L, exec, hyprlock
    bind = $mainMod SHIFT, P, exec, bash $scripts_DIR/utils/logout_menu.sh

	bind = $mainMod, RETURN, exec, $terminal

	bind = $mainMod, B, exec, env MOZ_ENABLE_WAYLAND=1 $browser # use this when the command works from terminal but doesn't when ran from keybinding
	#bind = $mainMod, B, exec, $browser
	bind = $mainMod, E, exec, $fileManager
    bind = $mainMod ALT, E, exec, $terminal $fileManager_alt

	# hyprland window management actions
	bind = $mainMod SHIFT, F, fullscreen # whole full screen
	bind = $mainMod CTRL, F, fullscreen, 1 # fake full screen
	bind = $mainMod, P, pseudo, # dwindle
	#bind = $mainMod, V, togglesplit, # dwindle
	bind = $mainMod, SPACE, togglefloating,
	bind = $mainMod ALT, SPACE, exec, hyprctl dispatch workspaceopt allfloat #All Float Mode

	bind = $mainMod ALT, N, exec, ~/.config/quickshell/scripts/modules/launch.sh ConnectionManager --fromShortcut
    bind = $mainMod ALT, A, exec, ~/.config/quickshell/scripts/modules/launch.sh MediaControl --fromShortcut
	bind = $mainMod ALT, Space, exec, ~/.config/quickshell/scripts/apps/launch.sh CommandPalette


source = $keybindings_DIR/workspace_and_window_actions.conf
source = $keybindings_DIR/screenshot.conf
source = $keybindings_DIR/function_binds.conf

source = ~/.config/pypr/pypr_keybindings.conf
