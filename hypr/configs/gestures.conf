gestures {
    gesture = 3, left, dispatcher, workspace, m+1
    gesture = 3, right, dispatcher, workspace, m-1
    #gesture = 3, horizontal, workspace

    gesture = 4, down, dispatcher, exec, bash $pypr_script term_0 # scratchpad
    gesture = 4, up, dispatcher, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
    gesture = 4, right, dispatcher, exec, wpctl set-volume -l 2 @DEFAULT_AUDIO_SINK@ 10%+
    gesture = 4, left, dispatcher, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 10%-

    gesture = 3, up, fullscreen
    gesture = 3, down, float
}
